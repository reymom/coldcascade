[profile.default]
src = "src"
test = "test"
script = "script"
solc = "0.8.30"
optimizer = true
# HyperEVM small blocks cap at 3 000 000 gas (measured on 999, 2026-09-05: 118 of 120 sampled
# blocks). Code deposit is 200 gas a byte, so a contract's runtime size is a deployment constraint
# and not only a taker cost. At 1 000 000 runs `DeskAccount` compiled to 18 552 bytes — 3 710 400
# gas of deposit, undeployable without opting into big blocks through an L1 action. At 200 it is
# 13 036 and every contract fits in a small block. See results/999_deploy_budget.md for what the
# difference costs a taker, which is what was traded away.
optimizer_runs = 200
via_ir = true
# The replay drives two takers through tens of thousands of real router quotes in one transaction —
# the arbitrageur's size search is most of them. That is far past the 2^30 forge ships with, and the
# work is real work, not a runaway loop: `BlindTakers.quoteOut` already reclaims its own memory, so
# what is left is the quotes themselves.
gas_limit = "1099511627776"
libs = ["node_modules"]
fs_permissions = [
  { access = "read", path = "./tape" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./deployments" },
]

# The inarbitrability property is the central claim, and a property is only as good as the number
# of books it was tried against. The suite runs in under a second, so the runs are cheap.
[fuzz]
runs = 1024

[rpc_endpoints]
hyperevm = "${HYPEREVM_RPC_URL}"
hypertestnet = "${HYPERTESTNET_RPC_URL}"

[fmt]
bracket_spacing = true
int_types = "long"
number_underscore = "thousands"
