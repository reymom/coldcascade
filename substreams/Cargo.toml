[package]
name = "coldcascade-substreams"
version = "0.1.0"
edition = "2021"
description = "coldcascade's own record off HyperEVM blocks: fills, books, maps and markouts"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"      # pinned to what substreams 0.7 links: two prosts in the graph is two Message traits
hex = "0.4"

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
