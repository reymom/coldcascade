specVersion: 1.2.0
description: coldcascade — a 1inch Aqua desk on HyperEVM quoting against Hyperliquid's own book
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: hyper-evm
    source:
      address: "0x1111113CCf1426A8E30e2bfF5E005d929bF6a90a"
      abi: Aqua
      startBlock: 0 # todo: deployment block of the first ship
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Strategy, Desk]
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
      file: ./src/aqua.ts
  - kind: ethereum
    name: DeskHooks
    network: hyper-evm
    source:
      address: "0x0000000000000000000000000000000000000000" # todo: deployments/999.json
      abi: DeskHooks
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Fill, Desk]
      abis:
        - name: DeskHooks
          file: ./abis/DeskHooks.json
      eventHandlers:
        - event: Fill(indexed bytes32,indexed address,address,address,address,uint256,uint256,uint64,uint64,uint64,uint64,uint128,uint128)
          handler: handleFill
      file: ./src/hooks.ts
  - kind: ethereum
    name: BookCache
    network: hyper-evm
    source:
      address: "0x0000000000000000000000000000000000000000" # todo
      abi: BookCache
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Booked, Desk]
      abis:
        - name: BookCache
          file: ./abis/BookCache.json
      eventHandlers:
        - event: Booked(indexed uint32,uint64,uint64,uint64,uint64,uint64,address)
          handler: handleBooked
      file: ./src/book.ts
  - kind: ethereum
    name: MapOracle
    network: hyper-evm
    source:
      address: "0x0000000000000000000000000000000000000000" # todo
      abi: MapOracle
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [MapUpdate, Desk]
      abis:
        - name: MapOracle
          file: ./abis/MapOracle.json
      eventHandlers:
        - event: MapUpdated(indexed uint32,uint128,uint128,uint64)
          handler: handleMapUpdated
      file: ./src/map.ts
  - kind: ethereum
    name: MarkoutLedger
    network: hyper-evm
    source:
      address: "0x0000000000000000000000000000000000000000" # todo
      abi: MarkoutLedger
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Markout]
      abis:
        - name: MarkoutLedger
          file: ./abis/MarkoutLedger.json
      eventHandlers:
        - event: Markout(indexed bytes32,indexed bytes32,uint8,int256,uint64)
          handler: handleMarkout
      file: ./src/markout.ts
