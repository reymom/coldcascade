"A shipped desk or control strategy, discovered from Aqua's own Shipped event by decoding the program."
type Strategy @entity(immutable: false) {
  id: Bytes!                 # orderHash
  maker: Bytes!
  isDesk: Boolean!           # program contains Extruction(CoreQuote); false for the control
  base: Bytes!
  quote: Bytes!
  perpIndex: Int!
  virtualBase: BigInt!       # Aqua's number, which does not clamp to the wallet
  virtualQuote: BigInt!
  unbacked: Boolean!         # virtual > wallet balance; the F2 edge, made visible
  docked: Boolean!
  fills: [Fill!]! @derivedFrom(field: "strategy")
  shippedAt: BigInt!
}

"One fill, with the book it was filled against. DeskHooks.Fill."
type Fill @entity(immutable: true) {
  id: Bytes!
  strategy: Strategy!
  maker: Bytes!
  taker: Bytes!
  makerBuysBase: Boolean!
  amountIn: BigInt!
  amountOut: BigInt!
  bid: BigInt!
  ask: BigInt!
  mark: BigInt!
  oracle: BigInt!
  dislocationBps: BigInt!
  mapBelow: BigInt!
  mapAbove: BigInt!
  timestamp: BigInt!
  block: BigInt!
  tx: Bytes!
  markouts: [Markout!]! @derivedFrom(field: "fill")
}

"The L1 book, as EVM logs. BookCache.Booked."
type Booked @entity(immutable: true) {
  id: Bytes!
  perpIndex: Int!
  bid: BigInt!
  ask: BigInt!
  mark: BigInt!
  oracle: BigInt!
  l1Block: BigInt!
  timestamp: BigInt!
}

"MapOracle.MapUpdated."
type MapUpdate @entity(immutable: true) {
  id: Bytes!
  perpIndex: Int!
  belowNotional: BigInt!
  aboveNotional: BigInt!
  updatedAt: BigInt!
}

"What the keeper computed from the entities above and wrote back. MarkoutLedger.Markout."
type Markout @entity(immutable: true) {
  id: Bytes!
  fill: Fill!
  horizonMinutes: Int!
  bps: BigInt!
  postedAt: BigInt!
}

"The desk as one thing: what the landing shows."
type Desk @entity(immutable: false) {
  id: ID!                    # perpIndex
  makers: Int!
  committedBase: BigInt!
  committedQuote: BigInt!
  unbackedCount: Int!
  fillCount: Int!
  lastBooked: Booked
  lastMapUpdate: MapUpdate
}
