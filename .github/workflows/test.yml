name: test
on: [push, pull_request]
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the build every gas figure in the README and the suite was measured with
          # (forge 1.4.4-nightly, 2025-11-14). The suite asserts gas, and two forge builds do not
          # report the same gas for the same bytecode: `nightly` is a different compiler on every run.
          version: nightly-975a456ef42ab506b8d343df5541a248798c5a27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: forge build
      - run: forge test

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No install step and no requirements file: the markout keeper is standard library and
      # `cast`, so the sign conventions it posts to the chain can be checked with nothing but a
      # Python. These are the two functions that fail *quietly* — a flipped sign is a plausible
      # number in the right range, and MarkoutLedger.post deliberately cannot restate one.
      - run: python -m unittest discover -s keeper/tests -v
      # The MCP server is standard library too, so the properties that would fail quietly — the
      # bracket never becoming a midpoint, the four kinds of absence never collapsing into one —
      # are checked with nothing but a Python.
      - run: python -m unittest discover -s mcp/tests -v
