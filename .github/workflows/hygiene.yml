name: hygiene
on: [push, pull_request]

# The submission repo holds only what a judge reads: no internal working documents, and no
# references to private projects or to the pre-event learning repo.
#
# It does NOT check for tooling references, and that is deliberate. An earlier version of this
# file grepped for `claude`, `anthropic`, `co-authored-by` and `generated with`, which had the
# effect of making the AI-usage disclosure ETHGlobal's rules require impossible to write inside
# the repository. Cleanliness about working documents and concealment of how the work was done
# are different things, and only the first belongs in CI. The disclosure is `AI-USAGE.md`, at the
# root, and the last job below fails the build if it goes missing.
#
# Commit trailers are still not checked, in either direction: attribution per commit is Ramon's
# call, and the disclosure covers the repository as a whole.
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no working docs are tracked
        run: |
          if git ls-files | grep -nE '(^|/)(CLAUDE|AGENTS)\.md$|(^|/)\.claude/'; then
            echo "::error::A working doc is tracked. Add it to .gitignore and git rm --cached it."
            exit 1
          fi
          echo "ok"

      - name: no internal references in tracked files
        run: |
          if git grep -nIiE 'defistar|learning spike' \
               -- ':!yarn.lock' ':!.gitignore' ':!.github/workflows/hygiene.yml'; then
            echo "::error::Tracked file contains an internal reference. Remove it before pushing."
            exit 1
          fi
          echo "ok"

      - name: the replay's column count is not stale
        # The page and the README both quote how many columns `results/oct10_replay.csv` has, and
        # the file grew a column at a time while the prose stayed at 45. A number a reader can
        # check in one command is worth having checked here instead: the schema is the source and
        # anything that disagrees with it fails the build.
        run: |
          n=$(head -1 results/oct10_replay.csv | awk -F, '{print NF}')
          stale=$(git grep -nIoE '[0-9]+ columns' \
                    -- ':!.github/workflows/hygiene.yml' | grep -v ":$n columns" || true)
          if [ -n "$stale" ]; then
            echo "::error::the replay has $n columns; these say otherwise:"
            echo "$stale"
            exit 1
          fi
          echo "ok — $n columns"

      - name: the AI-usage disclosure is present and linked from the README
        run: |
          test -f AI-USAGE.md || { echo "::error::AI-USAGE.md is missing. The event requires it."; exit 1; }
          grep -q 'AI-USAGE.md' README.md || { echo "::error::The README does not point at AI-USAGE.md."; exit 1; }
          echo "ok"
